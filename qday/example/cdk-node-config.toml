# =============================================================================
# CDK Node Configuration - sequence-sender + aggregator
# =============================================================================
# Update the following placeholders before use:
#   - Keystore files (sequencer / aggregator)
#   - L1 / L2 RPC URLs
#   - Contract addresses (deploy zkEVM contracts on L1 first)
# =============================================================================

# ---- Common ------------------------------------------------------------------
[Common]
IsValidiumMode = false
ContractVersions = "banana"
NetworkID = 1

# ---- Logging -----------------------------------------------------------------
[Log]
Environment = "development"   # "production" | "development"
Level = "info"                # "debug" | "info" | "warn" | "error"
Outputs = ["stderr"]

# ---- L1 Config (fill in after deploying zkEVM contracts) ---------------------
[L1Config]
chainId = 31337                             # L1 chain ID
polygonZkEVMGlobalExitRootAddress = "0xB7f8BC63BbcaD18155201308C8f3540b07f84F5e"
polygonRollupManagerAddress = "0x959922bE3CAee4b8Cd9a407cc3ac1C251C2007B1"
polTokenAddress = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
polygonZkEVMAddress = "0x24B3c7704709ed1491473F30393FFc93cFB0FC34"

# ---- Sequence Sender ---------------------------------------------------------
[SequenceSender]
WaitPeriodSendSequence = "15s"
LastBatchVirtualizationTimeMaxWaitPeriod = "10s"
L1BlockTimestampMargin = "30s"
MaxTxSizeForL1 = 131072
L2Coinbase = "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
PrivateKey = {Path = "/app/keystores/sequencer.keystore", Password = "testonly"}
SequencesTxFileName = "sequencesender.json"
GasOffset = 80000
WaitPeriodPurgeTxFile = "15m"
MaxPendingTx = 1
MaxBatchesForL1 = 300
BlockFinality = "FinalizedBlock"
RPCURL = "http://host.docker.internal:8545"          # L2 RPC (cdk-erigon)
GetBatchWaitInterval = "10s"

[SequenceSender.EthTxManager]
FrequencyToMonitorTxs = "1s"
WaitTxToBeMined = "2m"
GetReceiptMaxTime = "250ms"
GetReceiptWaitInterval = "1s"
PrivateKeys = [
    {Path = "/app/keystores/sequencer.keystore", Password = "testonly"},
]
ForcedGas = 0
GasPriceMarginFactor = 1
MaxGasPriceLimit = 0
StoragePath = "/app/data/ethtxmanager.db"
ReadPendingL1Txs = false
SafeStatusL1NumberOfBlocks = 5
FinalizedStatusL1NumberOfBlocks = 10

[SequenceSender.EthTxManager.Etherman]
URL = "http://host.docker.internal:1545"                     # L1 RPC
MultiGasProvider = false
L1ChainID = 31337
HTTPHeaders = []

# ---- Aggregator --------------------------------------------------------------
[Aggregator]
Host = "0.0.0.0"
Port = 50081
RetryTime = "5s"
VerifyProofInterval = "10s"
ProofStatePollingInterval = "5s"
BatchProofSanityCheckEnabled = true
ChainID = 44005
ForkId = 12
SenderAddress = "0x70997970c51812dc3a010c7d01b50e0d17dc79c8"
CleanupLockedProofsInterval = "2m"
GeneratingProofCleanupThreshold = "10m"
GasOffset = 0
RPCURL = "http://host.docker.internal:8545"           # L2 RPC (fetch batch/witness)
WitnessURL = "http://host.docker.internal:8545"
UseFullWitness = false
DBPath = "/app/data/aggregator.sqlite"
SettlementBackend = "l1"                   # "l1" | "agglayer"
AggLayerTxTimeout = "5m"
AggLayerURL = ""
SyncModeOnlyEnabled = false
SequencerPrivateKey = {}

[Aggregator.Log]
Environment = "development"
Level = "info"
Outputs = ["stderr"]

[Aggregator.EthTxManager]
FrequencyToMonitorTxs = "1s"
WaitTxToBeMined = "2m"
GetReceiptMaxTime = "250ms"
GetReceiptWaitInterval = "1s"
PrivateKeys = [
    {Path = "/app/keystores/aggregator.keystore", Password = "testonly"},
]
ForcedGas = 0
GasPriceMarginFactor = 1
MaxGasPriceLimit = 0
StoragePath = "/app/data/aggregator_ethtx.db"
ReadPendingL1Txs = false
SafeStatusL1NumberOfBlocks = 0
FinalizedStatusL1NumberOfBlocks = 0

[Aggregator.EthTxManager.Etherman]
URL = "http://host.docker.internal:1545"                     # L1 RPC
MultiGasProvider = false
L1ChainID = 31337
HTTPHeaders = []

[Aggregator.Synchronizer]
[Aggregator.Synchronizer.SQLDB]
DriverName = "sqlite3"
DataSource = "file:/app/data/aggregator_sync_db.sqlite"

[Aggregator.Synchronizer.Synchronizer]
SyncInterval = "10s"
SyncChunkSize = 1000
GenesisBlockNumber = 88229
SyncUpToBlock = "finalized"
BlockFinality = "finalized"
OverrideStorageCheck = false

[Aggregator.Synchronizer.Etherman]
L1URL = "http://host.docker.internal:1545"
ForkIDChunkSize = 100
L1ChainID = 31337
ParallelBlockRequest = false

[Aggregator.Synchronizer.Etherman.Contracts]
GlobalExitRootManagerAddr = "0xB7f8BC63BbcaD18155201308C8f3540b07f84F5e"
RollupManagerAddr = "0x959922bE3CAee4b8Cd9a407cc3ac1C251C2007B1"
ZkEVMAddr = "0x24B3c7704709ed1491473F30393FFc93cFB0FC34"

[Aggregator.Synchronizer.Etherman.Validium]
Enabled = false
TrustedSequencerURL = ""
RetryOnDACErrorInterval = "1m"
DataSourcePriority = ["trusted", "external"]

[Aggregator.Synchronizer.Etherman.Validium.Translator]
FullMatchRules = []

[Aggregator.Synchronizer.Etherman.Validium.RateLimit]
NumRequests = 1000
Interval = "1s"

# ---- Reorg Detector (L1 / L2) -----------------------------------------------
[ReorgDetectorL1]
DBPath = "/app/data/reorgdetectorl1.sqlite"
CheckReorgsInterval = "5s"

[ReorgDetectorL2]
DBPath = "/app/data/reorgdetectorl2.sqlite"
CheckReorgsInterval = "5s"

# ---- L1 Info Tree Sync -------------------------------------------------------
[L1InfoTreeSync]
DBPath = "/app/data/l1infotreesync.sqlite"
GlobalExitRootAddr = "0xB7f8BC63BbcaD18155201308C8f3540b07f84F5e"
RollupManagerAddr = "0x959922bE3CAee4b8Cd9a407cc3ac1C251C2007B1"
URLRPCL1 = "http://host.docker.internal:1545"
SyncBlockChunkSize = 100
BlockFinality = "FinalizedBlock"
WaitForNewBlocksPeriod = "5s"
InitialBlock = 88224
RetryAfterErrorPeriod = "10s"
MaxRetryAttemptsAfterError = 0
