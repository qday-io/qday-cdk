# =============================================================================
# Validator Configuration - batch confirmation service
# =============================================================================
# The signing key is VALIDATOR_PRIVATE_KEY, injected from .env (never write it
# here). The address derived from that key must equal ValidatorAddress in
# cdk-node-config.toml. The aggregator POSTs to http://validator:9001 (root
# path, no extra path). Health is GET /health.
# =============================================================================

[server]
listen = ":9001"

[validator]
# Must match NetworkID in cdk-node-config.toml
rollupId = 1

[l1]
rpc = "http://host.docker.internal:1545"    # L1 RPC
rollupManager = "0x959922bE3CAee4b8Cd9a407cc3ac1C251C2007B1"
# First L1 block to scan for SequenceBatches logs. 0 scans from genesis.
# Set to the L1 deployment block (matches L1InfoTreeSync InitialBlock).
initialBlock = 88215

[l2]
rpc = "http://host.docker.internal:8545"    # L2 RPC (must expose zkevm_getBatchByNumber)
