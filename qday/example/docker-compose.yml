# =============================================================================
# CDK Example - sequence-sender + aggregator + validator
# =============================================================================
# Prerequisites:
#   1. L1 chain with zkEVM contracts deployed (RollupManager, Bridge, GER, etc)
#      Update contract addresses in cdk-node-config.toml after deployment
#   2. Test keystore files are bundled in ./keystores/ (Hardhat test keys,
#      password "testonly"). Replace with your own keystores for production.
#   3. L2 node (cdk-erigon) must be running externally, providing:
#        - RPC port (default 8123)
#        - Data Streamer port (default 6900)
#   4. No ZK prover is used. The aggregator settles L1-synced batches with
#      signatures from the validator service (see qday/docs/validator.md).
#      The validator key is injected via VALIDATOR_PRIVATE_KEY in .env and its
#      address must match ValidatorAddress in cdk-node-config.toml.
#
# Usage:
#   cp env-example .env
#   docker compose -f qday/example/docker-compose.yml up -d
#
# View logs:
#   docker compose -f qday/example/docker-compose.yml logs -f
# =============================================================================

networks:
  cdk-net:
    driver: bridge

services:
  # ---- Validator -------------------------------------------------------------
  # Standalone batch confirmation service. Holds one secp256k1 key, re-checks
  # the batch range against its own L1/L2 endpoints, and signs only when all
  # checks pass. The aggregator POSTs settlement requests to http://validator:9001.
  validator:
    image: ${VALIDATOR_IMAGE}
    container_name: cdk-validator
    environment:
      - LISTEN=:9001
      - VALIDATOR_PRIVATE_KEY=${VALIDATOR_PRIVATE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./validator-config.toml:/config/config.toml:ro
    networks:
      - cdk-net
    ports:
      - "9001:9001"
    restart: unless-stopped

  # ---- Sequence Sender -------------------------------------------------------
  # Sends L2 batches to L1 rollup contract
  sequence-sender:
    image: ${CDK_NODE_IMAGE}
    container_name: cdk-sequence-sender
    command:
      - "cdk-node"
      - "run"
      - "--cfg"
      - "/app/config/cdk-node-config.toml"
      - "--components"
      - "sequence-sender"
    environment:
      - CDK_LOG_LEVEL=${CDK_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cdk-node-config.toml:/app/config/cdk-node-config.toml:ro
      - ./keystores:/app/keystores:ro
      - ./data/sequence-sender:/app/data
    networks:
      - cdk-net
    healthcheck:
      test: ["CMD", "pgrep", "cdk-node"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---- Aggregator ------------------------------------------------------------
  # Settles L1-synced batches to L1 with validator signatures (no ZK prover)
  aggregator:
    image: ${CDK_NODE_IMAGE}
    container_name: cdk-aggregator
    command:
      - "cdk-node"
      - "run"
      - "--cfg"
      - "/app/config/cdk-node-config.toml"
      - "--components"
      - "aggregator"
    environment:
      - CDK_LOG_LEVEL=${CDK_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cdk-node-config.toml:/app/config/cdk-node-config.toml:ro
      - ./keystores:/app/keystores:ro
      - ./data/aggregator:/app/data
    networks:
      - cdk-net
    healthcheck:
      test: ["CMD", "pgrep", "cdk-node"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      validator:
        condition: service_started
    restart: unless-stopped
